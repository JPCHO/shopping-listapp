<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span.icon { font-size: 1.8rem; }

    /* 입력 영역 */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .input-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      color: #2d3748;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row input::placeholder { color: #a0aec0; }

    .btn-add {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }

    .btn-add:hover { opacity: 0.9; }
    .btn-add:active { transform: scale(0.95); }

    /* 필터 탭 */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      flex: 1;
      background: #f7fafc;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #eef2ff;
      border-color: #667eea;
      color: #667eea;
    }

    /* 리스트 */
    #list { list-style: none; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 12px;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item:hover { background: #f7fafc; }

    /* 커스텀 체크박스 */
    .item input[type="checkbox"] { display: none; }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #cbd5e0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 0.75rem;
      color: #fff;
    }

    .item.done .check-box {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      transition: all 0.2s;
      word-break: break-all;
    }

    .item.done .item-text {
      color: #a0aec0;
      text-decoration: line-through;
    }

    .btn-del {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    .btn-del:hover { color: #e53e3e; background: #fff5f5; }

    /* 빈 상태 */
    .empty {
      text-align: center;
      padding: 40px 0 20px;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    .empty .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* 하단 요약 */
    .summary {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #718096;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #fff5f5; }
    .btn-clear:disabled { color: #cbd5e0; cursor: default; background: none; }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 40px 0 20px;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    /* 에러 토스트 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #e53e3e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: transform 0.3s;
      z-index: 999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="card">
  <h1><span class="icon">🛒</span> 쇼핑 리스트</h1>

  <div class="input-row">
    <input id="new-item" type="text" placeholder="아이템을 입력하세요" maxlength="80" />
    <button class="btn-add" id="btn-add" title="추가">＋</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="todo">미완료</button>
    <button class="filter-btn" data-filter="done">완료</button>
  </div>

  <ul id="list"></ul>

  <div id="empty" class="empty" style="display:none">
    <div class="empty-icon">🧺</div>
    <div>아이템이 없습니다</div>
  </div>

  <div class="summary">
    <span id="summary-text"></span>
    <button class="btn-clear" id="btn-clear">완료 항목 삭제</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL  = 'https://mqpfiidwvpabbumryrtq.supabase.co';
  const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcGZpaWR3dnBhYmJ1bXJ5cnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTgyNzAsImV4cCI6MjA5NjY5NDI3MH0.Xan8GWW7gvuGew3wCZt56gtV8G8GsKoEETe2Avi2xk0';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  let items  = [];
  let filter = 'all';

  const inputEl   = document.getElementById('new-item');
  const listEl    = document.getElementById('list');
  const emptyEl   = document.getElementById('empty');
  const summaryEl = document.getElementById('summary-text');
  const clearBtn  = document.getElementById('btn-clear');
  const toastEl   = document.getElementById('toast');

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  async function loadItems() {
    listEl.innerHTML = '<li class="loading">불러오는 중...</li>';
    const { data, error } = await supabase
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { showToast('데이터 로드 실패: ' + error.message); return; }
    items = data;
    render();
  }

  function render() {
    listEl.innerHTML = '';

    const visible = items.filter(it =>
      filter === 'all'  ? true :
      filter === 'done' ? it.done :
                          !it.done
    );

    emptyEl.style.display = visible.length === 0 ? 'block' : 'none';

    visible.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item' + (item.done ? ' done' : '');
      li.dataset.id = item.id;

      li.innerHTML = `
        <div class="check-box">${item.done ? '✓' : ''}</div>
        <span class="item-text">${escHtml(item.text)}</span>
        <button class="btn-del" title="삭제">✕</button>
      `;

      li.querySelector('.check-box').addEventListener('click', () => toggle(item.id, item.done));
      li.querySelector('.item-text').addEventListener('click', () => toggle(item.id, item.done));
      li.querySelector('.btn-del').addEventListener('click', () => remove(item.id));

      listEl.appendChild(li);
    });

    const total = items.length;
    const done  = items.filter(i => i.done).length;
    summaryEl.textContent = total === 0 ? '아이템 없음' : `${done} / ${total} 완료`;
    clearBtn.disabled = done === 0;
  }

  async function addItem() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    inputEl.value = '';
    inputEl.focus();

    const { data, error } = await supabase
      .from('shopping_items')
      .insert({ text, done: false })
      .select()
      .single();
    if (error) { showToast('추가 실패: ' + error.message); return; }
    items.unshift(data);
    render();
  }

  async function toggle(id, currentDone) {
    const { error } = await supabase
      .from('shopping_items')
      .update({ done: !currentDone })
      .eq('id', id);
    if (error) { showToast('업데이트 실패: ' + error.message); return; }
    const item = items.find(i => i.id === id);
    if (item) { item.done = !currentDone; render(); }
  }

  async function remove(id) {
    const { error } = await supabase
      .from('shopping_items')
      .delete()
      .eq('id', id);
    if (error) { showToast('삭제 실패: ' + error.message); return; }
    items = items.filter(i => i.id !== id);
    render();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('btn-add').addEventListener('click', addItem);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  clearBtn.addEventListener('click', async () => {
    const { error } = await supabase
      .from('shopping_items')
      .delete()
      .eq('done', true);
    if (error) { showToast('삭제 실패: ' + error.message); return; }
    items = items.filter(i => !i.done);
    render();
  });

  loadItems();
</script>
</body>
</html>
